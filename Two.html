<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> JS with Swarup </title>
    
</head>
<body style= "background-color: black; color: #fff">
 <ul class = "language">
    <li>JavaScript</li>
 </ul>    
</body>
<script>
// const div = document.createElement("div");
// const addText = document.createTextNode("Welcome buddy");
// div.appendChild(addText);
// document.body.appendChild(div);
function addLanguage(language){
    const li = document.createElement("li"); 
    li.innerHTML = `${language}`;
    document.querySelector(".language").
    appendChild(li); 
} 
addLanguage("Python");
addLanguage("C++");
addLanguage("Java");  

function addOptilanguage(lanName){
   const li = document.createElement(`li`)
   li.appendChild(document.createTextNode(lanName))
   document.querySelector('.language').appendChild(li)
}
addOptilanguage("Hindi")

//Edit

const seconsLang = document.querySelector("li:nth-child(2)")
//seconsLang.innerHTML = "Mojo"
const newli = document.createElement('li')
newli.textContent = "mojo"
seconsLang.replaceWith(newli)
 
//edit

const firstLang = document.querySelector("li:first-child")
firstLang.outerHTML = '<li>TypeScript</li>'

//remove 
const lastLang = document.querySelector('li:last-child')
lastLang.remove()
</script>
</html>
